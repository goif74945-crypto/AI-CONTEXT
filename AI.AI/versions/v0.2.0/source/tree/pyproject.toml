[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-ai-local-agent"
version = "0.2.0"
description = "Consent-gated desktop and Android companion agent with text, voice and clap controls"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2,<3", "pyautogui>=0.9.54,<1", "pyperclip>=1.9,<2"]

[project.optional-dependencies]
llm = ["openai>=1.60,<3"]
vision = ["pytesseract>=0.3.13,<1", "Pillow>=10,<13"]
browser = ["playwright>=1.50,<2"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
ai-ai = "ai_ai.main:main"

[tool.setuptools.packages.find]
include = ["ai_ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.package-data]
ai_ai = ["web/*.html", "web/*.css", "web/*.js"]
