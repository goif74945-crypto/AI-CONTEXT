name: one-shot-prune-ai-context-branches

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Delete every branch except the two retained branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -u
          KEEP_MAIN='main'
          KEEP_RESEARCH='research/energy-grand-challenge-swarm-20261006'
          failures=0

          mapfile -t branches < <(
            gh api --paginate "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[].name'
          )

          echo "Discovered ${#branches[@]} branches"

          for branch in "${branches[@]}"; do
            if [[ "$branch" == "$KEEP_MAIN" || "$branch" == "$KEEP_RESEARCH" ]]; then
              echo "KEEP $branch"
              continue
            fi

            echo "DELETE $branch"
            if ! gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"; then
              echo "::error::Failed to delete branch: $branch"
              failures=$((failures + 1))
            fi
          done

          echo "delete_failures=$failures" >> "$GITHUB_ENV"

      - name: Verify exact final branch set
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t final < <(
            gh api --paginate "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[].name' | sort
          )

          printf 'Final branches:\n'
          printf '%s\n' "${final[@]}"

          expected=$'main\nresearch/energy-grand-challenge-swarm-20261006'
          actual="$(printf '%s\n' "${final[@]}")"

          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Final branch set does not exactly match requested set."
            exit 1
          fi

          if [[ "${delete_failures:-0}" != "0" ]]; then
            echo "::error::One or more branch deletions reported failure."
            exit 1
          fi

      - name: Remove this temporary workflow from main
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          path='.github/workflows/prune-ai-context-branches-one-shot-20261006.yml'
          sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=main" --jq '.sha')"
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/contents/$path"             -f message='chore: remove one-shot branch prune workflow'             -f sha="$sha"             -f branch='main'
