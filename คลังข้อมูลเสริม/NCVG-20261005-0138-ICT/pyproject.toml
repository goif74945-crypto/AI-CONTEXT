[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexy-companion-verification-gate"
version = "0.1.0"
description = "Standalone fail-closed semantic verification gate for NEXY-compatible evidence bundles"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ncvg = "nexy_gate.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["nexy_gate*"]
