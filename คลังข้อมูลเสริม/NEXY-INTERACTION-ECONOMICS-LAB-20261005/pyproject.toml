[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexy-interaction-economics-lab"
version = "0.1.0"
description = "Deterministic interaction-friction analysis and authority-preserving decision planner for NEXY research."
requires-python = ">=3.11"
authors = [{name = "AI-proposed research artifact"}]
license = {text = "Internal research artifact; repository license governs redistribution."}

[project.scripts]
nexy-ixlab = "nexy_ixlab.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
