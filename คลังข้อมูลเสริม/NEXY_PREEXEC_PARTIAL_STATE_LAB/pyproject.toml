[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexy-pepsa"
version = "0.1.0"
description = "Experimental deterministic pre-execution partial-state analyzer for NEXY-style execution plans"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
nexy-pepsa = "nexy_pepsa.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
