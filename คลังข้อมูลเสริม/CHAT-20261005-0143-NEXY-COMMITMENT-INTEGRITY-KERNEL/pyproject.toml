[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexy-commitment-integrity-kernel-reference"
version = "0.1.0"
description = "AI-proposed deterministic reference kernel for NEXY commitment integrity research"
requires-python = ">=3.11"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
