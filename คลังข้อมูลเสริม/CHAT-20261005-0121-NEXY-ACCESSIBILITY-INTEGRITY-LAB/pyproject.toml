[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexy-accessibility-integrity-validator"
version = "0.1.0"
description = "Deterministic abstract accessibility-integrity validator for proposed NEXY UI surfaces"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
naicv = "naicv.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
