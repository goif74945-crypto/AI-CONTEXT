[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexy-operator-signal-intelligence"
version = "0.1.0"
description = "AI-proposed deterministic operator signal reference lab for NEXY-compatible systems"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
nexy-signal = "nexy_signal_intelligence.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
