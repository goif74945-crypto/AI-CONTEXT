[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexy-proofgraph-lab"
version = "0.1.0"
description = "Deterministic context integrity, truth-lock, and impact analysis for AI-CONTEXT"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
nexy-proofgraph = "nexy_proofgraph.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
