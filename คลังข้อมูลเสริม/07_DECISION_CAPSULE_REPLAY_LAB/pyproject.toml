[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexy-decision-capsule-replay-lab"
version = "0.1.0"
description = "AI-proposal reference implementation for deterministic NEXY decision capsules and replay."
requires-python = ">=3.11"
license = {text = "Repository policy applies"}

[project.scripts]
nexy-dcr = "nexy_dcr.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
