[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexy-freeze-bridge-reference"
version = "0.1.0"
description = "AI-proposed deterministic freeze explanation and recovery reference engine for NEXY research."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["freeze_bridge*"]
