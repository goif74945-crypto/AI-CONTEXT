[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexy-failure-witness-minimizer"
version = "0.1.0"
description = "Deterministic external failure-witness minimizer for NEXY-style execution traces"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
nfwm = "nfwm.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
