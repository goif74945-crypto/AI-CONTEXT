[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "nexy-proposal-forge"
version = "0.1.0"
description = "Deterministic, fail-closed evaluator for AI-proposed NEXY feature candidates."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
nexy-proposal-forge = "nexy_proposal_forge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
