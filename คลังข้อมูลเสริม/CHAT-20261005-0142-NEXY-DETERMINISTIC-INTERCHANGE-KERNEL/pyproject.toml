[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nexy-deterministic-interchange-kernel"
version = "0.1.0"
description = "Standalone deterministic interchange and proof-carrying envelope reference implementation for future NEXY integration."
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
