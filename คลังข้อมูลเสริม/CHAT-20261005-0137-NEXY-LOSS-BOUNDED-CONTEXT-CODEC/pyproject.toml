[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexy-lbcc"
version = "0.1.0"
description = "Deterministic loss-bounded context codec for provenance-aware AI context systems"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
lbcc = "lbcc.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
