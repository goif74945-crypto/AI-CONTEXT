[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexy-assurance-toolkit"
version = "0.1.0"
description = "AI-proposed deterministic reference toolkit for NEXY-compatible assurance workflows"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
nexy-aqt = "nexy_aqt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
