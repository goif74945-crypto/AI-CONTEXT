[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexy-truth-surface-compiler"
version = "0.2.0"
description = "AI-proposed deterministic reference compiler from internal truth claims to minimal user-facing Result Capsules."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
nxts = "nxts.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
