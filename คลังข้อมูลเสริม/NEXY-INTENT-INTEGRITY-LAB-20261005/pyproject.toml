[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexy-intent-integrity-lab"
version = "0.1.0"
description = "Research prototype for deterministic intent drift detection and scope/evidence guarding"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
nexy-intent-guard = "nexy_intent_guard.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
