[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexy-aux-composition-learning-lab"
version = "0.1.0"
description = "AI-proposed deterministic auxiliary research systems for NEXY-compatible integration"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
nexy-aux = "nexy_aux.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
