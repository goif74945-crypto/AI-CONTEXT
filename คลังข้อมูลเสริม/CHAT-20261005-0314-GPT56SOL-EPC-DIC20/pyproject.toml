[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epc-dic20"
version = "0.1.0"
description = "Deterministic interoperability court reference oracle for NEXY EPC Lo4 proposals"
requires-python = ">=3.11"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
